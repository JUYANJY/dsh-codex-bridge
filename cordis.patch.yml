# Loader patch fragment for this plugin (this package's `dsh.bundle.patch`).
#
# A profile that lists this package in `dsh.profile.bundles` gets this layer
# merged automatically, so a bundle install needs no hand-written entry.
#
# `id` is the short id the config tree and `plugin_manager` address. `name` is
# the package specifier, resolved from the profile's node_modules — it must equal
# the installed directory and the client factory id. Both bundle installs and
# checkout symlinks use this package's scoped name. When this bundle route is
# active, do not add a second hand-written row to the profile patch.
- insert:
    - id: dsh-codex-bridge
      name: '@juyanjy/dsh-codex-bridge'
      config:
        requestTimeoutMs: 30000
